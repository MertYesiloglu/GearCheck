<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearCheck - Donanım & Ekipman Rehberi</title>
    <link rel="stylesheet" href="css/stil.css">
</head>
<body>
    <header>
        <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
            <img src="images/gear-check.svg" alt="GearCheck Logo" width="64">
            <strong>GearCheck</strong>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="ekipmanlar.html">Ekipmanlar</a></li>
                <li><a href="ekipman-ekle.html" class="aktif">Yeni Ekipman & Donanım Ekle</a></li>
                <li><a href="hakkimda.html">Hakkımda</a></li>
                <li><a href="iletisim.html">İletişim</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="ekipman-ekle-alani">
            <h1>Yeni Ekipman & Donanım Ekle</h1>
            <p>Bu sayfada sisteme eklenecek olan donanım ve ekipman bilgileri yer alacaktır.</p>

            <form id="ekipmanFormu">
                <p>
                    <label for="ekipmanAdi">Ekipman Adı</label><br>
                    <input type="text" id="ekipmanAdi" name="ekipmanAdi" placeholder="Örn. Logitech G403">
                    <small id="karakterSayaci" style="color: #666; display: block; margin-top: 4px;">0 / 50 karakter</small>
                </p>

                <p>
                    <label for="fiyat">Fiyat (TL)</label><br>
                    <input type="number" id="fiyat" name="fiyat" placeholder="Örn. 1550">
                </p>

                <p>
                    <label for="kategori">Kategori</label><br>
                    <select id="kategori" name="kategori">
                        <option value="">Kategori Seçiniz</option>
                        <option value="mouse">Mouse</option>
                        <option value="kulaklik">Kulaklık</option>
                        <option value="klavye">Klavye</option>
                        <option value="islemci">İşlemci</option>
                        <option value="ekran-karti">Ekran Kartı</option>
                        <option value="diger">Diğer</option>
                    </select>
                </p>

                <p>
                    <label for="aciklama">Açıklama (Varsa)</label><br>
                    <textarea id="aciklama" name="aciklama" rows="3" placeholder="Donanım hakkında kısa bilgi..."></textarea>
                </p>

                <button type="submit">Kaydet</button>
            </form>
        </section>
    </main>


<script src="javascript/script.js"></script>  
</body>
</html>
