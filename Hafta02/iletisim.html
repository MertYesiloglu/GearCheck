<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearCheck - Donanım & Ekipman Rehberi</title>
    <link rel="stylesheet" href="css/stil.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-link" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
            <img src="images/gear-check.svg" alt="GearCheck Logo" width="64">
            <strong>GearCheck</strong>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="ekipmanlar.html">Ekipmanlar</a></li>
                <li><a href="ekipman-ekle.html">Yeni Ekipman & Donanım Ekle</a></li>
                <li><a href="hakkimda.html">Hakkımda</a></li>
                <li><a href="iletisim.html" class="aktif">İletişim</a></li>
            </ul>
        </nav>
    </header>

    <main>
                <section id="iletisim-bilgileri">
            <h2>Bize Ulaşın</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>📍 Adres</h3>
                    <p>Ankara / Gölbaşı</p>
                </div>
                <div class="stat-card">
                    <h3>✉️ E-posta</h3>
                    <p>mertyesiloglu2@gmail.com</p>
                </div>
            </div>
        </section>

        <section id="iletisim-formu-alani">
            <h2>İletişim Formu</h2>
            <form id="iletisimformu">
                <p>
                    <label for="adSoyad">Ad Soyad</label><br>
                    <input type="text" id="adSoyad" name="adSoyad" placeholder="Örn. Mert Yeşiloğlu" required>
                </p>
                <p>
                    <label for="eposta">E-posta Adresi</label><br>
                    <input type="email" id="eposta" name="eposta" placeholder="ornek@domain.com" required>
                </p>
                <p>
                    <label for="konu">Konu</label><br>
                    <select id="konu" name="konu">
                        <option value="genel">Genel Soru</option>
                        <option value="donanim">Donanım Önerisi</option>
                        <option value="hata">Hata Bildirimi</option>
                    </select>
                </p>
                <p>
                    <label for="mesaj">Mesajınız</label><br>
                    <textarea id="mesaj" name="mesaj" rows="4" placeholder="Mesajınızı buraya yazın..." required></textarea>
                </p>
                <button type="submit">Gönder</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 GearCheck</p>
    </footer>
</body>
</html>
