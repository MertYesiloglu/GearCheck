<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearCheck - Donanım & Ekipman Rehberi</title>
    <link rel="stylesheet" href="css/stil.css">
</head>
<body>
    <header>
        <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
            <img src="images/gear-check.svg" alt="GearCheck Logo" width="64">
            <strong>GearCheck</strong>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="ekipmanlar.html">Ekipmanlar</a></li>
                <li><a href="ekipman-ekle.html" class="aktif">Yeni Ekipman & Donanım Ekle</a></li>
            </ul>
        </nav>
    </header>
    <h1>Yeni Ekipman & Donanım Ekle</h1>
    <p>Bu sayfada sisteme eklenecek olan donanım ve ekipman bilgileri yer alacaktır.</p>
    <main>
    <h2>Ekipman Ekle</h2>

    <form id="ekipmanFormu">
    <p>
      <label for="ekipmanAdi">Ekipman adı</label><br>
      <input type="text" id="ekipmanAdi" name="ekipmanAdi" placeholder="Örn. Logitech G403" required>
    </p>

    <p>
      <label for="fiyat">Fiyat (TL)</label><br>
      <input type="number" id="fiyat" name="fiyat" min="0" required>
    </p>

    <p>
      <label for="kategori">Kategori</label><br>
      <select id="kategori" name="kategori">
        <option value="mouse">Mouse</option>
        <option value="kulaklik">Kulaklık</option>
        <option value="klavye">Klavye</option>
      </select>
    </p>

    <p>
      <label for="aciklama">Açıklama</label><br>
      <textarea id="aciklama" name="aciklama" rows="3"></textarea>
    </p>

    <button type="submit">Kaydet</button>
    </form>
    </main>

    
</body>
</html>
